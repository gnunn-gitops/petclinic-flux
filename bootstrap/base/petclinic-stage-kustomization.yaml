apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: petclinic-stage
  labels:
    app: petclinic
    env: stage
spec:
  interval: 1m
  url: https://github.com/gnunn-gitops/petclinic-flux.git
  ref:
    branch: environment/stage
  # The hydrated branch also carries .github/workflows and hydrator.metadata.
  # The Kustomization uses path ./ with no kustomization.yaml, so Flux
  # auto-generates one by recursively scanning for YAML; restrict the artifact
  # to the rendered manifests so Actions workflows are not treated as manifests.
  # gitignore syntax: /* excludes everything, then ! re-includes manifests.yaml,
  # which is the only file Flux deploys from this branch.
  ignore: |
    /*
    !/manifests.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: petclinic-stage
  labels:
    app: petclinic
    env: stage
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: petclinic-stage
  path: ./
  targetNamespace: petclinic-stage
  healthChecks:
    - apiVersion: argoproj.io/v1alpha1
      kind: Rollout
      name: petclinic
      namespace: petclinic-stage
  # Rollout is a custom resource that kstatus cannot evaluate on its own, so
  # the readiness rules are supplied as CEL expressions. status.phase is only
  # meaningful once the controller has observed the applied spec, and on a
  # Rollout status.observedGeneration is a string, hence the conversion.
  healthCheckExprs:
    - apiVersion: argoproj.io/v1alpha1
      kind: Rollout
      inProgress: >-
        !has(status.observedGeneration) ||
        status.observedGeneration != string(metadata.generation) ||
        (has(status.phase) && status.phase in ['Progressing', 'Paused'])
      failed: has(status.phase) && status.phase == 'Degraded'
      current: has(status.phase) && status.phase == 'Healthy'
